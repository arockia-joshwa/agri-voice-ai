version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agrivoice-backend
    ports:
      - "8000:8000"
    environment:
      - AI_MODE=demo
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agrivoice-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
